name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Crear proyecto Flutter base
        run: |
          flutter create . --project-name=leex_notes --org=com.kahleex
          cp lib/main.dart /tmp/main.dart.bak || true

      - name: Restaurar main.dart
        run: |
          if [ -f /tmp/main.dart.bak ]; then
            cp /tmp/main.dart.bak lib/main.dart
          fi

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: LEEX-Notes-APK
          path: build/app/outputs/flutter-apk/app-release.apk
